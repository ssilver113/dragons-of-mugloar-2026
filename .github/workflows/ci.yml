name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: |
            api/build/reports/tests/test
            api/build/reports/jacoco/test

  web:
    name: web (Vue 3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Before the build, so a lint or formatting failure is reported as itself rather than as
      # whatever the build happens to say next.
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:coverage

  e2e:
    name: e2e (Playwright, three engines)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Chromium, Firefox and WebKit on every run. This is where the cross-browser claim in the
      # README is actually checked; the suite stubs the backend, so no Java and no upstream.
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  container:
    name: container (Docker, boot and smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The command the README leads with, run as written rather than reassembled out of buildx
      # and a cache, so what CI proves is what a reviewer will type. --wait holds until the image's
      # own healthcheck reports UP, which makes a green step mean the jar started.
      - run: docker compose up --build --detach --wait --wait-timeout 300
      # What a healthy boot cannot tell you: the healthcheck runs inside the container against
      # localhost, and an image whose web stage copied nothing still passes it. These go through
      # the published port, and through the parts of the image only a request reaches.
      - name: Smoke the published port
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/index.html"
          curl -fsS http://localhost:8081/actuator/health | grep -q '"status":"UP"'
          # The bundle crosses a stage boundary as a directory copy, so serve the page and one
          # hashed asset off it — the copy is the glue most able to rot without anything noticing.
          curl -fsS http://localhost:8081/ -o "$page"
          grep -q '<div id="app">' "$page"
          # Held in a variable rather than substituted inline: an unmatched grep would otherwise
          # leave the bare origin, which serves the page again and answers 200 either way.
          asset=$(grep -m1 -o '/assets/index-[A-Za-z0-9_-]*\.js' "$page")
          curl -fsS "http://localhost:8081$asset" -o /dev/null
          # The API answers from inside the fat jar, and the shipped default still plays the real
          # game — an image that quietly shipped the simulation would look identical until scored.
          curl -fsS http://localhost:8081/api/meta | grep -q '"offline":false'
          curl -fsS http://localhost:8081/v3/api-docs | grep -q '/api/games'
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
