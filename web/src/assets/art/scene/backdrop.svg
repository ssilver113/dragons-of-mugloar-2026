<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" fill="none" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ecdd"/>
      <stop offset="0.42" stop-color="#dfe2df"/>
      <stop offset="1" stop-color="#c3cbc6"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9b6b6"/>
      <stop offset="1" stop-color="#cdd5d1"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b9c99"/>
      <stop offset="1" stop-color="#b6c1bb"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f7169"/>
      <stop offset="1" stop-color="#93a297"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ecdd" stop-opacity="0"/>
      <stop offset="1" stop-color="#eae7d6" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Three ridges, each paler and softer than the one in front of it. Atmospheric perspective is
       the whole illusion: distance here is a matter of contrast, not of scale. -->
  <path d="M0 470 L180 396 L322 442 L470 358 L640 430 L806 372 L972 438 L1140 380 L1310 444 L1462 392 L1600 448 V900 H0Z" fill="url(#far)" opacity="0.55"/>
  <path d="M0 560 L152 496 L300 548 L448 470 L604 542 L764 486 L920 552 L1082 494 L1244 556 L1408 500 L1600 560 V900 H0Z" fill="url(#mid)" opacity="0.5"/>

  <!-- The near treeline. Kept low and to the edges: the middle of the frame is where the board
       sits, and a silhouette behind it would fight the parchment for attention. -->
  <path d="M0 704 L44 660 L82 700 L128 648 L170 698 L214 664 L262 706 L308 672 L356 712 L404 684 L452 718 L500 700 L548 726 L1600 742 V900 H0Z" fill="url(#near)" opacity="0.42"/>
  <path d="M1600 690 L1556 646 L1518 688 L1472 636 L1430 686 L1386 652 L1338 694 L1292 660 L1244 700 L1196 674 L1148 710 L1100 694 L1052 722 L0 748 V900 H0Z" fill="url(#near)" opacity="0.36"/>

  <rect y="380" width="1600" height="520" fill="url(#haze)"/>
</svg>
